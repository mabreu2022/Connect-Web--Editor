<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir Senha - Gerador Lazarus SaaS</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #070913 0%, #0c0f24 50%, #050711 100%);
            --panel-bg: rgba(13, 18, 38, 0.45);
            --border-color: rgba(99, 102, 241, 0.15);
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --text-main: #f1f5f9;
            --text-muted: #64748b;
            --error-bg: rgba(239, 68, 68, 0.12);
            --error-border: rgba(239, 68, 68, 0.4);
            --error-text: #fca5a5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-gradient);
            color: var(--text-main);
            overflow-x: hidden;
            position: relative;
        }

        .glow-orb {
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.12) 0%, rgba(139, 92, 246, 0.05) 50%, transparent 100%);
            top: -100px;
            right: -100px;
            z-index: 1;
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 440px;
            padding: 24px;
            z-index: 10;
        }

        .card {
            background: var(--panel-bg);
            backdrop-filter: blur(24px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.45);
            animation: fadeIn 0.6s ease-out;
        }

        .logo-area {
            text-align: center;
            margin-bottom: 24px;
        }

        .logo-icon {
            font-size: 32px;
            background: rgba(99, 102, 241, 0.12);
            width: 64px;
            height: 64px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px;
            color: var(--primary);
            border: 1px solid rgba(99, 102, 241, 0.25);
        }

        .logo-text {
            font-size: 20px;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 4px;
        }

        .logo-sub {
            font-size: 12px;
            color: var(--text-muted);
        }

        h2 {
            font-size: 16px;
            font-weight: 700;
            color: #a5b4fc;
            margin-bottom: 20px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            font-size: 11px;
            font-weight: 700;
            color: #818cf8;
            display: block;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            transition: all 0.3s;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 12px var(--primary-glow);
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            color: white;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(99, 102, 241, 0.25);
            margin-top: 12px;
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .error-box {
            background: var(--error-bg);
            border: 1px solid var(--error-border);
            color: var(--error-text);
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
        }

        .success-area {
            text-align: center;
            display: none;
        }

        .success-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .success-title {
            color: #6ee7b7;
            font-size: 20px;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .success-desc {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.5;
            margin-bottom: 24px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="glow-orb"></div>

    <div class="container">
        <div class="card">
            <div id="formArea">
                <div class="logo-area">
                    <div class="logo-icon">⚡</div>
                    <h1 class="logo-text">Gerador Lazarus</h1>
                    <p class="logo-sub">Cadastrar Nova Senha</p>
                </div>

                <h2>Redefinir Senha</h2>

                <div id="errorBox" class="error-box"></div>

                <form id="resetForm">
                    <div class="form-group">
                        <label for="senha">Nova Senha</label>
                        <input type="password" id="senha" placeholder="Mínimo 6 caracteres" required>
                    </div>

                    <div class="form-group">
                        <label for="confirmar">Confirmar Nova Senha</label>
                        <input type="password" id="confirmar" placeholder="Repita a nova senha" required>
                    </div>

                    <button type="submit" id="submitBtn" class="submit-btn">Redefinir Senha</button>
                </form>
            </div>

            <div id="successArea" class="success-area">
                <div class="success-icon">🎉</div>
                <h3 class="success-title">Senha Redefinida!</h3>
                <p class="success-desc">
                    Sua senha foi redefinida com sucesso. Agora você já pode entrar na sua conta.
                </p>
                <button onclick="window.location.href='login.html'" class="submit-btn">Ir para Tela de Login</button>
            </div>
        </div>
    </div>

    <script>
        const resetForm = document.getElementById('resetForm');
        const formArea = document.getElementById('formArea');
        const successArea = document.getElementById('successArea');
        const errorBox = document.getElementById('errorBox');
        const submitBtn = document.getElementById('submitBtn');

        // Ler token da URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        if (!token) {
            errorBox.textContent = 'Token de redefinição ausente. Solicite um novo link.';
            errorBox.style.display = 'block';
            resetForm.style.display = 'none';
        }

        resetForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorBox.style.display = 'none';

            const senha = document.getElementById('senha').value;
            const confirmar = document.getElementById('confirmar').value;

            if (senha !== confirmar) {
                errorBox.textContent = 'As senhas não coincidem.';
                errorBox.style.display = 'block';
                return;
            }

            if (senha.length < 6) {
                errorBox.textContent = 'A senha deve ter pelo menos 6 caracteres.';
                errorBox.style.display = 'block';
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Processando...';

            try {
                const response = await fetch('/api/saas/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, novaSenha: senha })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Erro ao redefinir senha.');
                }

                formArea.style.display = 'none';
                successArea.style.display = 'block';

            } catch (err) {
                errorBox.textContent = err.message;
                errorBox.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Redefinir Senha';
            }
        });
    </script>
</body>
</html>
