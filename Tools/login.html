<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - Gerador Lazarus SaaS</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #070913 0%, #0c0f24 50%, #050711 100%);
            --panel-bg: rgba(13, 18, 38, 0.45);
            --border-color: rgba(99, 102, 241, 0.15);
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --primary-glow: rgba(99, 102, 241, 0.35);
            --text-main: #f1f5f9;
            --text-muted: #64748b;
            --error-bg: rgba(239, 68, 68, 0.12);
            --error-border: rgba(239, 68, 68, 0.4);
            --error-text: #fca5a5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-gradient);
            color: var(--text-main);
            overflow-x: hidden;
            position: relative;
        }

        /* Efeitos de luz no fundo */
        .glow-orb {
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.12) 0%, rgba(139, 92, 246, 0.05) 50%, transparent 100%);
            top: -100px;
            right: -100px;
            z-index: 1;
            pointer-events: none;
        }

        .glow-orb-2 {
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.1) 0%, rgba(99, 102, 241, 0.04) 50%, transparent 100%);
            bottom: -150px;
            left: -150px;
            z-index: 1;
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 440px;
            padding: 24px;
            z-index: 10;
        }

        .card {
            background: var(--panel-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.45);
            animation: fadeIn 0.6s ease-out;
        }

        .logo-area {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo-icon {
            font-size: 32px;
            background: rgba(99, 102, 241, 0.12);
            width: 64px;
            height: 64px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            color: var(--primary);
            border: 1px solid rgba(99, 102, 241, 0.25);
            box-shadow: 0 8px 24px rgba(99, 102, 241, 0.15);
            animation: pulse 3s infinite;
        }

        .logo-text {
            font-size: 24px;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: -0.5px;
            margin-bottom: 4px;
        }

        .logo-sub {
            font-size: 13px;
            color: var(--text-muted);
        }

        h2 {
            font-size: 18px;
            font-weight: 700;
            color: #a5b4fc;
            margin-bottom: 24px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 12px;
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        label {
            font-size: 11px;
            font-weight: 700;
            color: #818cf8;
            display: block;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            transition: all 0.3s;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 12px var(--primary-glow);
            background: rgba(255, 255, 255, 0.08);
        }

        .password-container {
            position: relative;
        }

        .password-container input {
            padding-right: 48px;
        }

        .eye-btn {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 18px;
            transition: color 0.2s;
        }

        .eye-btn:hover {
            color: var(--text-main);
        }

        .forgot-link-area {
            text-align: right;
            margin-bottom: 24px;
        }

        .forgot-link-area a {
            font-size: 13px;
            color: #818cf8;
            text-decoration: none;
            transition: color 0.2s;
        }

        .forgot-link-area a:hover {
            color: #a5b4fc;
            text-decoration: underline;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            color: white;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 8px 24px rgba(99, 102, 241, 0.25);
        }

        .submit-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 12px 28px rgba(99, 102, 241, 0.35);
        }

        .submit-btn:active {
            transform: translateY(1px);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .switch-text {
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 24px;
        }

        .switch-text a {
            color: #818cf8;
            text-decoration: none;
            font-weight: 600;
        }

        .switch-text a:hover {
            color: #a5b4fc;
            text-decoration: underline;
        }

        .error-box {
            background: var(--error-bg);
            border: 1px solid var(--error-border);
            color: var(--error-text);
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
            animation: shake 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(99, 102, 241, 0); }
            100% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }
    </style>
</head>
<body>
    <div class="glow-orb"></div>
    <div class="glow-orb-2"></div>

    <div class="container">
        <div class="card">
            <div class="logo-area">
                <div class="logo-icon">⚡</div>
                <h1 class="logo-text">Gerador Lazarus</h1>
                <p class="logo-sub">Plataforma SaaS Premium</p>
            </div>

            <h2>Entrar na sua conta</h2>

            <div id="errorBox" class="error-box"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="seu@email.com" required>
                </div>

                <div class="form-group">
                    <label for="senha">Senha</label>
                    <div class="password-container">
                        <input type="password" id="senha" placeholder="••••••••" required>
                        <button type="button" id="eyeBtn" class="eye-btn">👁️</button>
                    </div>
                </div>

                <div class="forgot-link-area">
                    <a href="forgot-password.html">Esqueci minha senha</a>
                </div>

                <button type="submit" id="submitBtn" class="submit-btn">Entrar</button>
            </form>

            <p class="switch-text">
                Não tem conta? <a href="register.html">Criar conta grátis</a>
            </p>
        </div>
    </div>

    <script>
        const eyeBtn = document.getElementById('eyeBtn');
        const senhaInput = document.getElementById('senha');
        const errorBox = document.getElementById('errorBox');
        const loginForm = document.getElementById('loginForm');
        const submitBtn = document.getElementById('submitBtn');

        // Mostrar/esconder senha
        eyeBtn.addEventListener('click', () => {
            const isPassword = senhaInput.type === 'password';
            senhaInput.type = isPassword ? 'text' : 'password';
            eyeBtn.textContent = isPassword ? '🙈' : '👁️';
        });

        // Submissão do form
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorBox.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.textContent = 'Entrando...';

            const email = document.getElementById('email').value.trim();
            const senha = senhaInput.value;

            try {
                const response = await fetch('/api/saas/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, senha })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Erro ao realizar login.');
                }

                // Armazenar dados da sessão
                localStorage.setItem('saas_token', data.token);
                localStorage.setItem('saas_user', JSON.stringify(data.user));

                // Se for Admin, redireciona direto
                if (data.user.isAdmin === 1) {
                    window.location.href = 'admin.html';
                    return;
                }

                // Usuário comum: verificar acesso Pix diário
                const accessCheck = await fetch('/api/saas/payments/check-access', {
                    headers: { 'Authorization': 'Bearer ' + data.token }
                });
                const accessData = await accessCheck.json();

                if (accessData.hasAccess) {
                    window.location.href = 'monitor.html';
                } else {
                    window.location.href = 'payment.html';
                }

            } catch (err) {
                errorBox.textContent = err.message;
                errorBox.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Entrar';
            }
        });
    </script>
</body>
</html>
